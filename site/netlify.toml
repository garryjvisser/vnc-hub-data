# Netlify configuration for VantageNorth Compliance Hub
# Publishes the site/ directory from the vnc-hub-data repo. No build step —
# per-story pages are pre-generated by the hub-build GitHub Action.

[build]
  publish = "."
  # No build command — all generation happens in GitHub Actions upstream

# Pretty URLs: /stories/foo instead of /stories/foo.html
[[redirects]]
  from = "/stories/:slug.html"
  to = "/stories/:slug"
  status = 301
  force = true

# stories.json: short cache (data file)
[[headers]]
  for = "/stories.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/slug-map.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"

# HTML pages: 10-minute cache, standard security headers
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=600"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/stories/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# JS: 1-hour cache
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Fonts + images: long cache
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
