name: VNC Social Cross-Post

# Fires when the daily scrub (or anyone) pushes changes to stories.json on main.
# Also supports manual run via the Actions tab, with a dry-run toggle.

on:
  push:
    branches: [main]
    paths:
      - "stories.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, do not actually post"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: social-crosspost
  cancel-in-progress: false

permissions:
  contents: write  # needed so the job can commit the post-state back to the repo

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history needed for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests requests-oauthlib

      - name: Run cross-post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python .github/scripts/social_crosspost.py

      - name: Commit post-state if changed
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [[ -n "$(git status --porcelain .github/last_post_state.json)" ]]; then
            git config user.name "VNC Social Cross-Post"
            git config user.email "social-crosspost@vantagenorth.ca"
            git add .github/last_post_state.json
            git commit -m "Record cross-post state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
